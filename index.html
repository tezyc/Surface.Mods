<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Surface Mods</title>

<style>

/* ================================
   BASIC
================================ */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#080808;
  color:#fff;
  min-height:100vh;
  overflow-x:hidden;
}


/* ================================
   NAVBAR
================================ */

.navbar{
  height:55px;
  padding:0 15px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  background:#0d0d0d;
  border-bottom:1px solid #222;

  position:sticky;
  top:0;
  z-index:100;

  animation:navbarIn .6s ease forwards;
}

.logo{
  font-size:19px;
  font-weight:bold;

  animation:logoIn .7s ease forwards;
}

.logo span{
  color:#888;
}

.social{
  display:flex;
  gap:8px;
}

.social a{
  width:32px;
  height:32px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#151515;
  border:1px solid #292929;
  border-radius:8px;

  transition:
    transform .25s ease,
    background .25s ease,
    border-color .25s ease;
}

.social a:hover{
  background:#202020;
  border-color:#555;
  transform:translateY(-3px) scale(1.05);
}

.social a:active{
  transform:scale(.92);
}

.social svg{
  width:17px;
  height:17px;
  fill:#fff;
  transition:transform .25s ease;
}

.social a:hover svg{
  transform:scale(1.1);
}


/* ================================
   MAIN
================================ */

.container{
  max-width:900px;
  margin:auto;
  padding:22px 14px;
}


/* ================================
   HERO
================================ */

.hero{
  text-align:center;
  margin:65px 0 55px;

  animation:heroIn .8s ease forwards;
}

.hero h1{
  font-size:30px;

  animation:titleIn .8s ease .1s both;
}

.hero p{
  color:#777;
  font-size:14px;
  margin-top:8px;

  animation:descriptionIn .8s ease .25s both;
}


/* ================================
   SECTION TITLE
================================ */

.section-title{
  font-size:20px;
  margin-bottom:12px;

  animation:sectionIn .7s ease .3s both;
}


/* ================================
   APP GRID
================================ */

.grid{
  display:grid;
  gap:10px;
}


/* ================================
   APP CARD
================================ */

.card{
  display:flex;
  align-items:center;
  gap:12px;

  background:#111;
  border:1px solid #292929;
  border-radius:11px;
  padding:10px;

  cursor:pointer;

  opacity:0;
  transform:translateY(18px);

  animation:cardIn .55s ease forwards;

  transition:
    transform .25s ease,
    border-color .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.card:nth-child(1){
  animation-delay:.15s;
}

.card:nth-child(2){
  animation-delay:.25s;
}

.card:nth-child(3){
  animation-delay:.35s;
}

.card:nth-child(4){
  animation-delay:.45s;
}

.card:nth-child(5){
  animation-delay:.55s;
}

.card:nth-child(6){
  animation-delay:.65s;
}

.card:hover{
  border-color:#444;
  background:#131313;

  transform:
    translateY(-3px)
    scale(1.005);

  box-shadow:
    0 8px 25px rgba(0,0,0,.35);
}

.card:active{
  transform:scale(.98);
}


/* ================================
   APP ICON
================================ */

.icon{
  width:62px;
  height:62px;

  flex:none;

  border-radius:9px;

  background:#191919;
  border:1px solid #333;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;

  overflow:hidden;

  transition:
    transform .3s ease,
    border-color .3s ease;
}

.card:hover .icon{
  transform:scale(1.05);
  border-color:#555;
}

.icon img{
  width:100%;
  height:100%;
  object-fit:cover;

  transition:transform .3s ease;
}

.card:hover .icon img{
  transform:scale(1.08);
}


/* ================================
   APP CARD TEXT
================================ */

.card-info{
  min-width:0;
  flex:1;
}

.card-info h2{
  font-size:16px;
  margin-bottom:4px;

  transition:transform .25s ease;
}

.card:hover .card-info h2{
  transform:translateX(2px);
}

.card-info p{
  color:#888;
  font-size:12px;
}


/* ================================
   DOWNLOAD BUTTON
   OLD DESIGN
================================ */

.download{
  flex:none;

  padding:9px 15px;

  border-radius:8px;

  border:1px solid #777;

  background:rgba(255,255,255,.06);

  color:#fff;

  font-weight:bold;
  font-size:12px;

  cursor:pointer;

  transition:
    background .25s ease,
    border-color .25s ease,
    transform .2s ease,
    box-shadow .25s ease;
}

.download:hover{
  background:rgba(255,255,255,.13);
  border-color:#aaa;

  transform:
    translateY(-2px);

  box-shadow:
    0 5px 15px rgba(255,255,255,.05);
}

.download:active{
  transform:scale(.93);
}


/* ================================
   APP PAGE
================================ */

#appPage{
  display:none;
}

#appPage.page-enter{
  animation:pageIn .45s ease forwards;
}


/* ================================
   BACK BUTTON
================================ */

.back{
  display:inline-block;

  margin-bottom:16px;

  color:#aaa;

  cursor:pointer;

  font-size:14px;

  transition:
    color .2s ease,
    transform .2s ease;
}

.back:hover{
  color:#fff;
  transform:translateX(-4px);
}

.back:active{
  transform:translateX(-7px) scale(.97);
}


/* ================================
   APP INFO
================================ */

.appInfo{
  background:#111;

  border:1px solid #292929;

  border-radius:13px;

  padding:18px;

  max-width:700px;

  margin:auto;

  animation:infoCardIn .5s ease forwards;
}


/* ================================
   APP HEADER
================================ */

.appHeader{
  display:flex;
  align-items:center;

  gap:14px;

  margin-bottom:20px;
}

.appIcon{
  width:82px;
  height:82px;

  border-radius:11px;

  background:#191919;
  border:1px solid #444;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:38px;

  flex:none;

  overflow:hidden;

  animation:iconIn .5s ease .15s both;

  transition:
    transform .3s ease,
    border-color .3s ease;
}

.appIcon:hover{
  transform:scale(1.04);
  border-color:#666;
}

.appIcon img{
  width:100%;
  height:100%;
  object-fit:cover;
}


.appTitle{
  font-size:23px;

  animation:textIn .5s ease .15s both;
}

.appDescription{
  color:#888;
  font-size:13px;
  margin-top:5px;

  animation:textIn .5s ease .25s both;
}


/* ================================
   INFO TITLES
================================ */

.infoTitle{
  font-size:15px;

  margin:17px 0 8px;

  animation:textIn .5s ease .3s both;
}


/* ================================
   INFO BOX
================================ */

.infoBox{
  background:#0b0b0b;

  border:1px solid #292929;

  border-radius:9px;

  padding:12px;

  color:#999;

  font-size:12px;

  line-height:1.6;

  white-space:pre-wrap;

  animation:boxIn .5s ease .35s both;

  transition:
    border-color .25s ease,
    background .25s ease;
}

.infoBox:hover{
  border-color:#444;
  background:#0d0d0d;
}


/* ================================
   FEATURES
================================ */

.features{
  border:1px solid #292929;

  border-radius:9px;

  overflow:hidden;

  animation:boxIn .5s ease .4s both;

  transition:border-color .25s ease;
}

.features:hover{
  border-color:#444;
}

.featuresHead{
  padding:11px 13px;

  font-weight:bold;

  background:#151515;

  cursor:pointer;

  display:flex;
  justify-content:space-between;

  transition:
    background .25s ease;
}

.featuresHead:hover{
  background:#1b1b1b;
}

#arrow{
  transition:
    transform .3s ease;
}

.featuresList{
  padding:10px 13px;

  list-style:none;

  overflow:hidden;

  max-height:500px;

  opacity:1;

  transition:
    max-height .35s ease,
    opacity .25s ease,
    padding .35s ease;
}

.featuresList.collapsed{
  max-height:0;
  opacity:0;
  padding-top:0;
  padding-bottom:0;
}

.featuresList li{
  padding:6px 0;

  color:#aaa;

  font-size:13px;

  opacity:0;
  transform:translateX(-10px);

  animation:featureIn .35s ease forwards;
}

.featuresList li:nth-child(1){
  animation-delay:.1s;
}

.featuresList li:nth-child(2){
  animation-delay:.15s;
}

.featuresList li:nth-child(3){
  animation-delay:.2s;
}

.featuresList li:nth-child(4){
  animation-delay:.25s;
}

.featuresList li:nth-child(5){
  animation-delay:.3s;
}

.featuresList li:nth-child(6){
  animation-delay:.35s;
}

.featuresList li::before{
  content:"✓";

  color:#bbb;

  margin-right:9px;

  transition:color .2s ease;
}

.featuresList li:hover{
  color:#fff;
}

.featuresList li:hover::before{
  color:#fff;
}


/* ================================
   BIG DOWNLOAD
================================ */

.bigDownload{
  width:100%;

  margin-top:17px;

  padding:11px;

  border-radius:8px;

  border:1px solid #777;

  background:rgba(255,255,255,.06);

  color:#fff;

  font-weight:bold;

  cursor:pointer;

  animation:downloadIn .5s ease .5s both;

  transition:
    background .25s ease,
    border-color .25s ease,
    transform .2s ease,
    box-shadow .25s ease;
}

.bigDownload:hover{
  background:rgba(255,255,255,.13);

  border-color:#aaa;

  transform:translateY(-2px);

  box-shadow:
    0 7px 20px rgba(255,255,255,.05);
}

.bigDownload:active{
  transform:scale(.97);
}


/* ================================
   FOOTER
================================ */

footer{
  text-align:center;

  color:#444;

  padding:30px 10px;

  font-size:11px;

  animation:footerIn 1s ease .6s both;
}


/* ================================
   ANIMATIONS
================================ */

@keyframes navbarIn{

  from{
    opacity:0;
    transform:translateY(-15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes logoIn{

  from{
    opacity:0;
    transform:translateX(-15px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}

@keyframes heroIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}

@keyframes titleIn{

  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}

@keyframes descriptionIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes sectionIn{

  from{
    opacity:0;
    transform:translateX(-15px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}

@keyframes cardIn{

  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes pageIn{

  from{
    opacity:0;
    transform:translateY(12px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes infoCardIn{

  from{
    opacity:0;
    transform:translateY(18px) scale(.98);
  }

  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }

}

@keyframes iconIn{

  from{
    opacity:0;
    transform:scale(.8) rotate(-3deg);
  }

  to{
    opacity:1;
    transform:scale(1) rotate(0);
  }

}

@keyframes textIn{

  from{
    opacity:0;
    transform:translateX(10px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}

@keyframes boxIn{

  from{
    opacity:0;
    transform:translateY(8px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes featureIn{

  from{
    opacity:0;
    transform:translateX(-10px);
  }

  to{
    opacity:1;
    transform:translateX(0);
  }

}

@keyframes downloadIn{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes footerIn{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


/* ================================
   MOBILE
================================ */

@media(max-width:500px){

  .hero{
    margin:45px 0 38px;
  }

  .hero h1{
    font-size:27px;
  }

  .card{
    padding:8px;
  }

  .icon{
    width:55px;
    height:55px;
  }

  .download{
    padding:8px 10px;
  }

  .appInfo{
    padding:14px;
  }

  .appTitle{
    font-size:20px;
  }

}


/* ================================
   REDUCE MOTION
================================ */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }

}

</style>
</head>

<!-- ================================

================================ -->

<main
  id="home"
  class="container"
>


  <section class="hero">

    <h1>

    </h1>

    <p>

    </p>

  <h2 class="section-title">

<main

<script>


/* ==========================================
   APP DATA / JSON-LIKE CONFIG
==========================================

   Add more apps inside this array.

========================================== */

const apps = [


  {
    name: "Mortal Company (Latest)",

    version: "0.2.2",

    description:
      "Modified application with additional features.",

    icon:
      "Images/Mortal.jpeg",

    info:
`Format: APK
Version: 0.2 .2
Arm64 - v8a`,

    features: [

      "Unlimited Money",
      
      "Unlimited Batteries",
      
      "Unlimited Stamina",

      "Removed Ads",

      "God Mod",

      "No fall Damage",
      
      "Speed Hack",
      
      "Super Jump",

    ],

    mediafire:
      "https://www.mediafire.com/file/r7gzzrnkrd41kvc/Mortal+Company_0.2.2_Mod+Menu_v1.apk/file"

  },


  {
    name: "Music Mod",

    version: "9.3.4",

    description:
      "Enhanced music application.",

    icon:
      "🎵",

    info:
`Name: Music Mod
Version: 9.3.4`,

    features: [

      "Premium features",

      "Extra controls",

      "Additional customization",

      "Updated version"

    ],

    mediafire:
      "https://www.mediafire.com/"

  }


];



/* ==========================================
   APP GRID
========================================== */

const grid =
  document.getElementById(
    "appGrid"
  );



function loadApps(){


  grid.innerHTML = "";


  apps.forEach(
    (app,index)=>{


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "card";


      card.onclick =
        () => showApp(index);



      /*
        Support emoji icons
        and image paths.
      */

      let iconHTML =
        app.icon;


      if(
        app.icon.startsWith("http") ||
        app.icon.startsWith("images/")
      ){

        iconHTML =
          `
          <img
            src="${app.icon}"
            alt="${app.name}"
          >
          `;

      }



      card.innerHTML = `

        <div class="icon">

          ${iconHTML}

        </div>


        <div class="card-info">

          <h2>
            ${app.name}
          </h2>

          <p>
            ${app.version}
          </p>

        </div>


        <button
          class="download"
          onclick="downloadApp(event,${index})"
        >

          Download

        </button>

      `;


      grid.appendChild(card);


    }
  );

}



/* ==========================================
   DOWNLOAD
========================================== */

function downloadApp(
  event,
  index
){

  /*
    Prevents clicking Download
    from opening App Info.
  */

  event.stopPropagation();


  window.location.href =
    apps[index].mediafire;

}



/* ==========================================
   OPEN APP INFO
========================================== */

function showApp(index){


  const app =
    apps[index];


  const home =
    document.getElementById(
      "home"
    );


  const appPage =
    document.getElementById(
      "appPage"
    );


  home.style.display =
    "none";


  appPage.style.display =
    "block";


  /*
    Restart page animation.
  */

  appPage.classList.remove(
    "page-enter"
  );


  void appPage.offsetWidth;


  appPage.classList.add(
    "page-enter"
  );



  /*
    Icon
  */

  let iconHTML =
    app.icon;


  if(
    app.icon.startsWith("http") ||
    app.icon.startsWith("images/")
  ){

    iconHTML =
      `
      <img
        src="${app.icon}"
        alt="${app.name}"
      >
      `;

  }


  document.getElementById(
    "infoIcon"
  ).innerHTML =
    iconHTML;



  /*
    Name
  */

  document.getElementById(
    "infoName"
  ).textContent =
    app.name;



  /*
    Description
  */

  document.getElementById(
    "infoDescription"
  ).textContent =
    app.description;



  /*
    App Info
  */

  document.getElementById(
    "infoBox"
  ).textContent =
    app.info;



  /*
    Features
  */

  const list =
    document.getElementById(
      "infoFeatures"
    );


  list.innerHTML =
    "";


  app.features.forEach(
    (feature,index)=>{


      const li =
        document.createElement(
          "li"
        );


      li.textContent =
        feature;


      /*
        Restart feature animation.
      */

      li.style.animationDelay =
        `${0.1 + index * 0.05}s`;


      list.appendChild(
        li
      );

    }
  );


  list.classList.remove(
    "collapsed"
  );


  document.getElementById(
    "arrow"
  ).textContent =
    "⌃";



  /*
    Download button
  */

  document.getElementById(
    "infoDownload"
  ).onclick =
    () => {

      window.location.href =
        app.mediafire;

    };



  /*
    Start at top.
  */

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}



/* ==========================================
   COLLAPSE FEATURES
========================================== */

function toggleFeatures(){


  const list =
    document.getElementById(
      "infoFeatures"
    );


  const arrow =
    document.getElementById(
      "arrow"
    );


  if(
    list.classList.contains(
      "collapsed"
    )
  ){

    list.classList.remove(
      "collapsed"
    );


    arrow.textContent =
      "⌃";


  }else{


    list.classList.add(
      "collapsed"
    );


    arrow.textContent =
      "⌄";

  }

}



/* ==========================================
   BACK HOME
========================================== */

function goHome(){


  const appPage =
    document.getElementById(
      "appPage"
    );


  appPage.style.opacity =
    "0";


  appPage.style.transform =
    "translateY(10px)";


  setTimeout(()=>{


    appPage.style.display =
      "none";


    appPage.style.opacity =
      "";


    appPage.style.transform =
      "";


    document.getElementById(
      "home"
    ).style.display =
      "block";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });


  },220);

}
